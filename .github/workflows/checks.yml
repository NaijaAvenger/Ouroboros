# Checks that need no Unity licence: unit tests and an offline C# type-check. See Tools/README.md.
name: checks

on:
  push:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test Tools/tests --nologo

      - name: Map layout is generated and passes its own checks
        run: |
          python3 Tools/mapgen/galleria.py
          git diff --exit-code -- Assets/Editor/OuroborosGalleriaLayout.cs

      - name: Shaders parse and type-check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
          Tools/shadercheck/run.sh

      - name: Cache type-check references
        uses: actions/cache@v4
        with:
          path: Tools/typecheck/.cache
          key: typecheck-refs-${{ hashFiles('Packages/manifest.json', 'Tools/typecheck/run.sh') }}

      - name: Type-check game scripts
        run: Tools/typecheck/run.sh
